name: vibepod
base: core24
adopt-info: vibepod
summary: One CLI for containerized AI coding agents
description: |
  Run AI coding agents in Docker or Podman containers with persistent
  configuration, workspace mounts, session logging and HTTP observability.
grade: stable
confinement: classic
license: MIT
platforms:
  amd64:

apps:
  vibepod:
    command: bin/vibepod
  vp:
    command: bin/vp

parts:
  vibepod:
    plugin: python
    source: .
    build-packages:
      - python3-dev
      - python3-venv
    stage-packages:
      # Classic confinement cannot use core24's Python interpreter. Explicitly
      # stage it: python3-venv's dependencies already in the base are filtered.
      - python3
      - python3.12-minimal
      - libpython3.12-minimal
      - libpython3.12-stdlib
      - python3-venv
      - ca-certificates
    build-attributes:
      - enable-patchelf
    override-build: |
      craftctl default
      # The plugin leaves classic snaps tied to the host's Python: the venv's
      # pyvenv.cfg points at the build host's /usr/bin, which makes the staged
      # interpreter load the host's stdlib, and console scripts use
      # `#!/usr/bin/env python3`, which resolves python3 from the host PATH.
      # Pin both to the bundled interpreter. snapd always mounts the active
      # revision at /snap/<name>/current, whatever the confinement.
      snap_root="/snap/${CRAFT_PROJECT_NAME}/current"
      sed -i "s|^home = .*|home = ${snap_root}/usr/bin|" "${CRAFT_PART_INSTALL}/pyvenv.cfg"
      grep -qx "home = ${snap_root}/usr/bin" "${CRAFT_PART_INSTALL}/pyvenv.cfg"
      for script in vibepod vp; do
        sed -i "1 s|^#!/usr/bin/env python3\$|#!${snap_root}/bin/python3|" "${CRAFT_PART_INSTALL}/bin/${script}"
        [ "$(head -n 1 "${CRAFT_PART_INSTALL}/bin/${script}")" = "#!${snap_root}/bin/python3" ]
      done
    override-pull: |
      craftctl default
      craftctl set version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
