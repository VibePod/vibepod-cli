name: vibepod
base: core24
adopt-info: vibepod
summary: One CLI for containerized AI coding agents
description: |
  Run AI coding agents in Docker or Podman containers with persistent
  configuration, workspace mounts, session logging and HTTP observability.
grade: stable
confinement: classic
license: MIT
platforms:
  amd64:

apps:
  vibepod:
    command: bin/vibepod
  vp:
    command: bin/vp

parts:
  vibepod:
    plugin: python
    source: .
    build-packages:
      - python3-dev
      - python3-venv
    stage-packages:
      # Classic confinement cannot use core24's Python interpreter. Explicitly
      # stage it: python3-venv's dependencies already in the base are filtered.
      - python3
      - python3.12-minimal
      - libpython3.12-minimal
      - libpython3.12-stdlib
      - python3-venv
      - ca-certificates
    build-attributes:
      - enable-patchelf
    override-pull: |
      craftctl default
      craftctl set version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
