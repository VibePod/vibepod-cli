name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  default-images:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate default images
        run: python scripts/check_default_images.py

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # Pull requests test every Python on Ubuntu but only the oldest and newest on
        # Windows and macOS; main runs the full matrix.
        exclude: >-
          ${{ github.event_name == 'pull_request' && fromJSON('[
          {"os": "windows-latest", "python-version": "3.11"},
          {"os": "windows-latest", "python-version": "3.12"},
          {"os": "windows-latest", "python-version": "3.13"},
          {"os": "windows-latest", "python-version": "3.14"},
          {"os": "macos-latest", "python-version": "3.11"},
          {"os": "macos-latest", "python-version": "3.12"},
          {"os": "macos-latest", "python-version": "3.13"},
          {"os": "macos-latest", "python-version": "3.14"}
          ]') || fromJSON('[]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      VIBEPOD_TEST_RUNTIME: ${{ matrix.runtime }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # On Ubuntu runners pasta, Podman's default rootless network helper, cannot be stopped when
      # the last container leaves a network ("rootless netns: kill network process: permission
      # denied"), so the rootless network namespace runs on slirp4netns instead.
      - name: Use slirp4netns for rootless Podman networking
        if: matrix.runtime == 'podman'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q slirp4netns
          mkdir -p ~/.config/containers
          printf '[network]\ndefault_rootless_network_cmd = "slirp4netns"\n' > ~/.config/containers/containers.conf
          echo "::notice title=Podman::$(podman version --format '{{.Client.Version}}'), network helper $(podman info --format '{{.Host.RootlessNetworkCmd}}')"

      - name: Start Podman API socket
        if: matrix.runtime == 'podman'
        run: |
          systemctl --user enable --now podman.socket
          echo "DOCKER_HOST=unix:///run/user/$(id -u)/podman/podman.sock" >> "$GITHUB_ENV"

      - name: Verify daemon responds
        run: |
          SOCKET="${DOCKER_HOST:-unix:///var/run/docker.sock}"
          curl -sf --unix-socket "${SOCKET#unix://}" http://d/_ping
          echo "daemon OK on ${SOCKET}"

      - name: Run integration tests
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/integration.log"
          if python -m pytest -m integration -v 2>&1 | tee "$log"; then
            exit 0
          fi
          # Until the Ubuntu runners can stop pasta again, the known rootless netns stop error in
          # test_pull_run_mount_stop is reported as a warning; any other failure fails the job.
          failed="$(grep '^FAILED ' "$log" || true)"
          if [ "$VIBEPOD_TEST_RUNTIME" = podman ] \
            && [ "$(printf '%s\n' "$failed" | grep -c .)" -eq 1 ] \
            && printf '%s\n' "$failed" | grep -q '::test_pull_run_mount_stop ' \
            && grep -q 'rootless netns: kill network process: permission denied' "$log"; then
            echo "::warning title=Podman::test_pull_run_mount_stop hit the known rootless netns stop error"
            exit 0
          fi
          exit 1

      - name: Annotate integration failures
        if: failure() && matrix.runtime == 'podman'
        run: |
          grep -E '^(FAILED|E +[A-Za-z.]*(Error|Exception))' "$RUNNER_TEMP/integration.log" | head -n 5 \
            | while IFS= read -r line; do echo "::error title=Integration::$line"; done || true
          sudo journalctl -k --no-pager | grep 'apparmor="DENIED"' | tail -n 5 \
            | while IFS= read -r line; do echo "::error title=AppArmor::$line"; done || true

  integration-macos:
    # Allowed to fail and slow to set up, so pull requests skip it.
    if: github.event_name != 'pull_request'
    runs-on: macos-26-intel
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      VIBEPOD_TEST_RUNTIME: ${{ matrix.runtime }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Set up Docker via Colima
        if: matrix.runtime == 'docker'
        run: |
          brew install colima docker
          colima start
          echo "DOCKER_HOST=unix://$HOME/.colima/default/docker.sock" >> "$GITHUB_ENV"

      - name: Set up Podman machine
        if: matrix.runtime == 'podman'
        run: |
          # No Homebrew bottle for podman on Intel macOS (Tier 3); use official installer.
          # Pinned: podman 6.x dropped the Intel macOS installer, 5.8 is the last branch shipping it.
          curl -fsSL -o podman.pkg https://github.com/containers/podman/releases/download/v5.8.5/podman-installer-macos-amd64.pkg
          sudo installer -pkg podman.pkg -target /
          echo "/opt/podman/bin" >> "$GITHUB_PATH"
          export PATH="/opt/podman/bin:$PATH"
          podman machine init --now
          echo "DOCKER_HOST=unix://$(podman machine inspect --format '{{.ConnectionInfo.PodmanSocket.Path}}')" >> "$GITHUB_ENV"

      - name: Verify daemon responds
        run: |
          SOCKET="${DOCKER_HOST:-unix:///var/run/docker.sock}"
          curl -sf --unix-socket "${SOCKET#unix://}" http://d/_ping
          echo "daemon OK on ${SOCKET}"

      - name: Run integration tests
        run: python -m pytest -m integration -v

  lint-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy src
