name: Snap

on:
  pull_request:
    paths:
      - 'src/**'
      - 'snap/**'
      - 'scripts/*snap*'
      - 'tests/test_snap.py'
      - 'pyproject.toml'
      - '.github/workflows/snap.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snap-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install -e '.[dev]'
          VP_CONFIG_DIR="$RUNNER_TEMP/vibepod-test-config" python -m pytest
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          tag = os.environ['RELEASE_TAG']
          if tag and tag.removeprefix('v') != version:
              raise SystemExit(f'Release tag {tag} does not match CLI version {version}')
          PY
      - uses: snapcore/action-build@v1
        id: build
      - name: Install and validate the packaged CLI with Docker
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
          DOCKER_HOST: unix:///var/run/docker.sock
          VP_SNAP_EXPECTED_RUNTIME: docker
        run: |
          sudo snap install --dangerous --classic "$SNAP_FILE"
          export VP_CONFIG_DIR="$RUNNER_TEMP/vibepod-snap-config"
          export VP_SNAP_EXPECTED_VERSION="$(python -c 'import importlib.metadata; print(importlib.metadata.version("vibepod"))')"
          snap run vibepod version
          snap run vibepod.vp version
          snap run --shell vibepod <<'SH'
          exec "$SNAP/bin/python3" "$PWD/scripts/smoke_snap.py"
          SH
      - name: Validate the packaged CLI with rootless Podman
        env:
          VP_SNAP_EXPECTED_RUNTIME: rootless-podman
        run: |
          systemctl --user enable --now podman.socket
          export DOCKER_HOST="unix:///run/user/$(id -u)/podman/podman.sock"
          curl --fail --silent --show-error --unix-socket "${DOCKER_HOST#unix://}" http://d/_ping
          export VP_CONFIG_DIR="$RUNNER_TEMP/vibepod-snap-podman-config"
          export VP_SNAP_EXPECTED_VERSION="$(python -c 'import importlib.metadata; print(importlib.metadata.version("vibepod"))')"
          snap run --shell vibepod <<'SH'
          exec "$SNAP/bin/python3" "$PWD/scripts/smoke_snap.py"
          SH
      - uses: actions/upload-artifact@v4
        with:
          name: vibepod-snap-amd64
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
      - name: Check release publisher setup
        if: github.event_name == 'release'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo '::error::Snap publication requires SNAPCRAFT_STORE_CREDENTIALS. Complete the publisher setup in docs/snap.md.'
            exit 1
          fi
      - name: Publish validated release
        if: github.event_name == 'release'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ github.event.release.prerelease && 'latest/beta' || 'latest/stable' }}
