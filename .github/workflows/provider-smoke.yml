name: Provider smoke tests

on:
  pull_request:
    paths:
      - "src/vibepod/**"
      - "tests/integration/test_provider_smoke.py"
      - ".github/workflows/provider-smoke.yml"
  workflow_dispatch:
    inputs:
      agents_ref:
        description: "vibepod-agents ref to build agent images from"
        default: main
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        agent: [pi, codex, qwen, tau, jcode, opencode]
    env:
      VP_PROVIDER_SMOKE: "1"
      VP_PROVIDER_SMOKE_AGENT: ${{ matrix.agent }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: VibePod/vibepod-agents
          ref: ${{ inputs.agents_ref || vars.PROVIDER_AGENTS_REF || 'main' }}
          path: agent-images
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      # Image builds download agent releases from GitHub and npm, which time out now and then.
      - name: Build real agent image
        run: |
          for attempt in 1 2 3; do
            docker build -t vp-provider-test-${{ matrix.agent }} agent-images/docker/${{ matrix.agent }} && exit 0
            echo "::warning title=Image build::attempt $attempt failed"
            sleep 15
          done
          exit 1
      - name: Run native agent against local fake API
        run: python -m pytest -m integration tests/integration/test_provider_smoke.py -v
